line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# FastAPI's dependency-injection parameter markers are meant to be used
# as argument defaults (`file: UploadFile = File(...)`) — that's the
# framework's own idiomatic pattern, not the mutable-default-argument bug
# B008 otherwise correctly flags.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]
