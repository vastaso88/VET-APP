# Weekly dependency update PRs (security audit 2026-10-26): Python
# backend, Flutter client, admin portal and the GitHub Actions themselves.
# Security advisories are surfaced automatically once this file exists
# (Dependabot alerts also need to be enabled in the repository settings).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "pub"
    directory: "/apps/mobile_app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/apps/admin_portal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
