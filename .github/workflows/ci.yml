name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy apps packages tests
      - name: Test
        run: uv run pytest


  admin_portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install admin dependencies
        run: npm install
      - name: Admin typecheck
        run: npm run typecheck
      - name: Admin build
        run: npm run build
