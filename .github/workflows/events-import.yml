name: Events import

# Weekly refresh of the "Eventi" section: the tracked curated files
# (scripts/events/curated) and the public calendars listed in
# scripts/events/sources.json (none enabled by default: the step is then a
# no-op). Uses the same two repository secrets as the radar import:
#   RADAR_SUPABASE_URL                 e.g. https://<project-ref>.supabase.co
#   RADAR_SUPABASE_SERVICE_ROLE_KEY    the project's secret (service-role) key
# Without them the job stops at the first step and writes nothing.

on:
  schedule:
    # Mondays 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::RADAR_SUPABASE_URL and RADAR_SUPABASE_SERVICE_ROLE_KEY are not set"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Import curated events
        run: uv run python scripts/events/import_curated.py
      - name: Import public calendars
        run: uv run python scripts/events/import_feeds.py
