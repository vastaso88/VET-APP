name: Radar places import

# Refreshes the radar's offline catalog for Italy in Supabase: Overture Maps
# and OpenStreetMap (from the Geofabrik extract, not from public Overpass
# servers). Needs two repository secrets, set by the owner in
# Settings -> Secrets and variables -> Actions:
#   RADAR_SUPABASE_URL                 e.g. https://<project-ref>.supabase.co
#   RADAR_SUPABASE_SERVICE_ROLE_KEY    the project's secret (service-role) key
# Without them the job stops at the first step and writes nothing.
# The scripts refuse the production project unless --allow-production is
# given: this job is the decided monthly refresh, so it passes it.

on:
  schedule:
    # 03:00 UTC on the 2nd of each month: Overture publishes monthly.
    - cron: "0 3 2 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-places-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::RADAR_SUPABASE_URL and RADAR_SUPABASE_SERVICE_ROLE_KEY are not set"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync
      - name: Import Overture places
        run: uv run --extra radar-import python scripts/radar/import_overture_places.py --allow-production
      # One download of the Italian extract from download.geofabrik.de
      # (robots.txt and usage page allow programs; ~2.1 GB), read with
      # pyosmium in three passes without a node index, then deleted. Measured
      # locally on 2026-11-26: see docs/maps/COUNTRIES.md §3. A standard
      # runner (4 CPU, 16 GB RAM, ~14 GB free disk) has room for it.
      - name: Import OpenStreetMap places (Geofabrik extract)
        run: >-
          uv run --extra radar-import python scripts/radar/import_osm_places.py
          --country IT --pbf-dir "$RUNNER_TEMP/pbf" --delete-pbf --allow-production
      - name: Import municipal dog parks
        run: uv run python scripts/radar/import_municipal_dog_parks.py --allow-production
      - name: Apply report retention
        run: uv run python scripts/radar/cleanup_reports.py --allow-production
      # The request log (time, name, address, outcome; no content) is kept,
      # as the project rule on external sites asks.
      - name: Keep the request log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-requests-log
          path: .local/radar/requests.log
          if-no-files-found: ignore
          retention-days: 90
