name: Lint and Test

on:
  workflow_dispatch:

# Read-only token: this job only checks code (security audit 2026-10-26).
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run checks
        run: |
          uv run ruff check .
          uv run mypy apps packages tests
          uv run pytest
