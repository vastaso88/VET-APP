name: Admin ingestion scheduler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ingestion-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEDULER_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
      # Optional dedicated secret: must be the same value as ADMIN_SCHEDULER_SECRET on Vercel.
      ADMIN_SCHEDULER_SECRET: ${{ secrets.ADMIN_SCHEDULER_SECRET }}
      VET_API_BASE_URL: https://vet-app-psi-nine.vercel.app
    steps:
      - name: Check scheduler secret
        run: |
          if [ -z "$SCHEDULER_SERVICE_ROLE_KEY" ] && [ -z "$ADMIN_SCHEDULER_SECRET" ]; then
            echo "::error::Neither ADMIN_SCHEDULER_SECRET nor RADAR_SUPABASE_SERVICE_ROLE_KEY is set"
            exit 1
          fi
      - name: Run due admin schedules
        shell: bash
        run: |
          # The backend expects the dedicated secret as it is when ADMIN_SCHEDULER_SECRET
          # is set there, and otherwise the sha256 of the service-role key (legacy).
          if [ -n "$ADMIN_SCHEDULER_SECRET" ]; then
            TOKEN="$ADMIN_SCHEDULER_SECRET"
          else
            TOKEN="$(printf 'vetapp-admin-scheduler:%s' "$SCHEDULER_SERVICE_ROLE_KEY" | sha256sum | awk '{print $1}')"
          fi
          for attempt in {1..10}; do
            RESPONSE_FILE="$(mktemp)"
            HTTP_CODE="$(curl --silent --show-error               --max-time 300               --output "$RESPONSE_FILE"               --write-out "%{http_code}"               --request POST               --header "X-VetApp-Scheduler: $TOKEN"               "$VET_API_BASE_URL/admin/scheduler/tick" || true)"

            RESPONSE="$(cat "$RESPONSE_FILE")"
            rm -f "$RESPONSE_FILE"

            if [ "$HTTP_CODE" = "404" ]; then
              echo "::warning::Scheduler endpoint is not deployed yet; skipping this tick."
              exit 0
            fi

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "$RESPONSE"
              echo "::error::Scheduler endpoint returned HTTP $HTTP_CODE"
              exit 1
            fi

            echo "$RESPONSE"
            CLAIMED="$(echo "$RESPONSE" | jq -r '.claimed // 0')"
            if [ "$CLAIMED" -eq 0 ]; then
              break
            fi
          done
      - name: Erase accounts whose deletion period has ended
        # Runs even if the ingestion tick above failed: the two jobs are independent.
        if: ${{ !cancelled() }}
        # Idempotent and cheap: the backend only counts until
        # ACCOUNT_DELETION_PURGE_ENABLED is true. The answer is counts only.
        shell: bash
        run: |
          # The backend expects the dedicated secret as it is when ADMIN_SCHEDULER_SECRET
          # is set there, and otherwise the sha256 of the service-role key (legacy).
          if [ -n "$ADMIN_SCHEDULER_SECRET" ]; then
            TOKEN="$ADMIN_SCHEDULER_SECRET"
          else
            TOKEN="$(printf 'vetapp-admin-scheduler:%s' "$SCHEDULER_SERVICE_ROLE_KEY" | sha256sum | awk '{print $1}')"
          fi
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 300 --output "$RESPONSE_FILE" --write-out "%{http_code}" --request POST --header "X-VetApp-Scheduler: $TOKEN" "$VET_API_BASE_URL/admin/lifecycle/purge-deleted-accounts" || true)"
          cat "$RESPONSE_FILE"
          # Counts only. A positive "alarm" is something the team has to look at (a notice that
          # cannot go out, an account waiting for its notice): the job turns red.
          ALARM="$(jq -r '.alarm // 0' "$RESPONSE_FILE" 2>/dev/null || echo 0)"
          rm -f "$RESPONSE_FILE"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::Purge endpoint is not deployed yet; skipping."
            exit 0
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Purge endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
          if [ "$ALARM" -gt 0 ] 2>/dev/null; then
            echo "::error::accounts waiting for their deletion notice or erased without it: $ALARM (see the counts above)"
            exit 1
          fi
      - name: Prune the register of deletions
        # Independent of the steps above.
        if: ${{ !cancelled() }}
        # Idempotent: removes only rows older than the retention. Counts only.
        shell: bash
        run: |
          # The backend expects the dedicated secret as it is when ADMIN_SCHEDULER_SECRET
          # is set there, and otherwise the sha256 of the service-role key (legacy).
          if [ -n "$ADMIN_SCHEDULER_SECRET" ]; then
            TOKEN="$ADMIN_SCHEDULER_SECRET"
          else
            TOKEN="$(printf 'vetapp-admin-scheduler:%s' "$SCHEDULER_SERVICE_ROLE_KEY" | sha256sum | awk '{print $1}')"
          fi
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 300 --output "$RESPONSE_FILE" --write-out "%{http_code}" --request POST --header "X-VetApp-Scheduler: $TOKEN" "$VET_API_BASE_URL/admin/lifecycle/prune-deletion-log" || true)"
          cat "$RESPONSE_FILE"
          rm -f "$RESPONSE_FILE"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::Prune endpoint is not deployed yet; skipping."
            exit 0
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Prune endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
      - name: Prune the reservations of chat messages
        # Independent of the steps above.
        if: ${{ !cancelled() }}
        # Idempotent: removes only keys older than 30 days; answers 200 with a zero count
        # until the table exists. Counts only.
        shell: bash
        run: |
          # The backend expects the dedicated secret as it is when ADMIN_SCHEDULER_SECRET
          # is set there, and otherwise the sha256 of the service-role key (legacy).
          if [ -n "$ADMIN_SCHEDULER_SECRET" ]; then
            TOKEN="$ADMIN_SCHEDULER_SECRET"
          else
            TOKEN="$(printf 'vetapp-admin-scheduler:%s' "$SCHEDULER_SERVICE_ROLE_KEY" | sha256sum | awk '{print $1}')"
          fi
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 300 --output "$RESPONSE_FILE" --write-out "%{http_code}" --request POST --header "X-VetApp-Scheduler: $TOKEN" "$VET_API_BASE_URL/admin/lifecycle/prune-chat-message-keys" || true)"
          cat "$RESPONSE_FILE"
          rm -f "$RESPONSE_FILE"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::Prune endpoint is not deployed yet; skipping."
            exit 0
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Prune endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
      - name: Prune the Mercatino ads taken down by the team
        # Independent of the steps above.
        if: ${{ !cancelled() }}
        # Idempotent: hides the photos of removed ads, deletes them 6 months after the
        # decision; answers 200 with zero counts until the table exists. Counts only.
        shell: bash
        run: |
          # The backend expects the dedicated secret as it is when ADMIN_SCHEDULER_SECRET
          # is set there, and otherwise the sha256 of the service-role key (legacy).
          if [ -n "$ADMIN_SCHEDULER_SECRET" ]; then
            TOKEN="$ADMIN_SCHEDULER_SECRET"
          else
            TOKEN="$(printf 'vetapp-admin-scheduler:%s' "$SCHEDULER_SERVICE_ROLE_KEY" | sha256sum | awk '{print $1}')"
          fi
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 300 --output "$RESPONSE_FILE" --write-out "%{http_code}" --request POST --header "X-VetApp-Scheduler: $TOKEN" "$VET_API_BASE_URL/admin/lifecycle/prune-removed-listings" || true)"
          cat "$RESPONSE_FILE"
          rm -f "$RESPONSE_FILE"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::Prune endpoint is not deployed yet; skipping."
            exit 0
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Prune endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
      - name: Send the due exit e-mails (deletion)
        # Independent of the steps above.
        if: ${{ !cancelled() }}
        # Idempotent: the backend only counts, and touches nothing, until EMAIL_SENDING_ENABLED
        # is true and the wording is configured. The answer is counts only.
        shell: bash
        run: |
          # The backend expects the dedicated secret as it is when ADMIN_SCHEDULER_SECRET
          # is set there, and otherwise the sha256 of the service-role key (legacy).
          if [ -n "$ADMIN_SCHEDULER_SECRET" ]; then
            TOKEN="$ADMIN_SCHEDULER_SECRET"
          else
            TOKEN="$(printf 'vetapp-admin-scheduler:%s' "$SCHEDULER_SERVICE_ROLE_KEY" | sha256sum | awk '{print $1}')"
          fi
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 300 --output "$RESPONSE_FILE" --write-out "%{http_code}" --request POST --header "X-VetApp-Scheduler: $TOKEN" "$VET_API_BASE_URL/admin/lifecycle/send-exit-notices" || true)"
          cat "$RESPONSE_FILE"
          # Counts only. A positive "alarm" is something the team has to look at (a notice that
          # cannot go out, an account waiting for its notice): the job turns red.
          ALARM="$(jq -r '.alarm // 0' "$RESPONSE_FILE" 2>/dev/null || echo 0)"
          rm -f "$RESPONSE_FILE"
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::Exit e-mail endpoint is not deployed yet; skipping."
            exit 0
          fi
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Exit e-mail endpoint returned HTTP $HTTP_CODE"
            exit 1
          fi
          if [ "$ALARM" -gt 0 ] 2>/dev/null; then
            echo "::error::exit e-mails failed or overdue: $ALARM (see the counts above)"
            exit 1
          fi
