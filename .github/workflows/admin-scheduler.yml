name: Admin ingestion scheduler

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ingestion-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCHEDULER_SERVICE_ROLE_KEY: ${{ secrets.RADAR_SUPABASE_SERVICE_ROLE_KEY }}
      VET_API_BASE_URL: https://vet-app-psi-nine.vercel.app
    steps:
      - name: Check scheduler secret
        run: |
          if [ -z "$SCHEDULER_SERVICE_ROLE_KEY" ]; then
            echo "::error::RADAR_SUPABASE_URL and RADAR_SUPABASE_SERVICE_ROLE_KEY are not set"
            exit 1
          fi
      - name: Run due admin schedules
        shell: bash
        run: |
          TOKEN="$(printf 'vetapp-admin-scheduler:%s' "$SCHEDULER_SERVICE_ROLE_KEY" | sha256sum | awk '{print $1}')"
          for attempt in {1..10}; do
            RESPONSE_FILE="$(mktemp)"
            HTTP_CODE="$(curl --silent --show-error               --max-time 300               --output "$RESPONSE_FILE"               --write-out "%{http_code}"               --request POST               --header "X-VetApp-Scheduler: $TOKEN"               "$VET_API_BASE_URL/admin/scheduler/tick" || true)"

            RESPONSE="$(cat "$RESPONSE_FILE")"
            rm -f "$RESPONSE_FILE"

            if [ "$HTTP_CODE" = "404" ]; then
              echo "::warning::Scheduler endpoint is not deployed yet; skipping this tick."
              exit 0
            fi

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "$RESPONSE"
              echo "::error::Scheduler endpoint returned HTTP $HTTP_CODE"
              exit 1
            fi

            echo "$RESPONSE"
            CLAIMED="$(echo "$RESPONSE" | jq -r '.claimed // 0')"
            if [ "$CLAIMED" -eq 0 ]; then
              break
            fi
          done
