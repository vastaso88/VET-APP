name: vet_app_mobile
description: Web-first Flutter client for VET APP, with mobile-ready support.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.10.3
  google_fonts: ^6.2.1
  http: ^1.2.0
  url_launcher: ^6.3.0
  intl: ^0.20.3
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  record: ^7.1.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
